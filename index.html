<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="Sistema de gestión integral para Gorilas Gym: socios, coaches, pagos, mediciones, rutinas y nutrición.">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <div id="app">
    <div class="boot">
      <div class="boot-logo">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="4.3" cy="10.2" r="2.2"/>
          <circle cx="19.7" cy="10.2" r="2.2"/>
          <path d="M12 3.2c-3.6 0-6.2 2.3-6.2 5.6 0 1.3.3 2.2.3 3.2 0 4.3 2.5 8 5.9 8s5.9-3.7 5.9-8c0-1 .3-1.9.3-3.2 0-3.3-2.6-5.6-6.2-5.6z"/>

          <path d="M10.9 16.2h.01"/>
          <path d="M13.1 16.2h.01"/>
        </svg>
      </div>
      <p>Cargando Gorilas Gym…</p>
    </div>
  </div>

  <!-- Capas globales -->
  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
  <div id="modales"></div>

  <!-- ===== Núcleo ===== -->

  <script src="js/core/icons.js"></script>
  <script src="js/core/calc.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/db.js"></script>

  <!-- ===== Catálogos ===== -->
  <script src="js/data/exercises.js"></script>
  <script src="js/data/foods.js"></script>
  <script src="js/data/ilustraciones.js"></script>
  <script src="js/data/seed.js"></script>

  <script src="js/core/router.js"></script>

  <script src="js/modules/pagos.js"></script>

  <script src="js/views/socio_nutricion.js"></script>
