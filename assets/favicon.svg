<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Gorilas Gym Fitness Club">
  <title>Gorilas Gym Fitness Club</title>

  <defs>
    <!-- Fondo carbón con destello rojo -->
    <radialGradient id="ggFondo" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#3A0D10"/>
      <stop offset="1" stop-color="#0E0F11"/>
    </radialGradient>
    <!-- Neón rojo del aro -->
    <linearGradient id="ggNeon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A3D"/>
      <stop offset="1" stop-color="#A61B16"/>
    </linearGradient>
    <!-- Pelaje del gorila -->
    <linearGradient id="ggPelo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset="0.55" stop-color="#C3CAD4"/>
      <stop offset="1" stop-color="#7E8793"/>
    </linearGradient>
    <!-- Acero de la barra olímpica -->
    <linearGradient id="ggAcero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EBF0"/>
      <stop offset="1" stop-color="#8B939F"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#ggFondo)"/>

  <!-- Aro de neón: halo difuso y trazo nítido -->
  <circle cx="32" cy="28" r="20" fill="none" stroke="#E4322B" stroke-width="7" opacity=".22"/>
  <circle cx="32" cy="28" r="20" fill="none" stroke="url(#ggNeon)" stroke-width="2.6"/>
  <!-- Guiño azul del logo, abajo a la derecha -->
  <path d="M46.2 41.4a20 20 0 0 1-9.7 6.5" fill="none" stroke="#2F7BFF" stroke-width="2.6"
        stroke-linecap="round" opacity=".85"/>

  <!-- Barra olímpica detrás del gorila -->
  <rect x="4" y="45.2" width="56" height="3.4" rx="1.7" fill="url(#ggAcero)"/>
  <rect x="6.4" y="41" width="5.2" height="11.8" rx="2" fill="url(#ggAcero)"/>
  <rect x="52.4" y="41" width="5.2" height="11.8" rx="2" fill="url(#ggAcero)"/>
  <rect x="13.4" y="43" width="3.4" height="7.8" rx="1.4" fill="#9AA2AE"/>
  <rect x="47.2" y="43" width="3.4" height="7.8" rx="1.4" fill="#9AA2AE"/>

  <!-- Orejas -->
  <circle cx="14.6" cy="25.6" r="5" fill="url(#ggPelo)"/>
  <circle cx="49.4" cy="25.6" r="5" fill="url(#ggPelo)"/>
  <circle cx="14.6" cy="25.6" r="2.2" fill="#6A737F"/>
  <circle cx="49.4" cy="25.6" r="2.2" fill="#6A737F"/>

  <!-- Cabeza -->
  <path d="M32 9.4c-8.8 0-15.2 5.6-15.2 13.7 0 3.2.8 5.4.8 7.8 0 10.6 6.2 19.6 14.4 19.6s14.4-9 14.4-19.6c0-2.4.8-4.6.8-7.8C47.2 15 40.8 9.4 32 9.4z" fill="url(#ggPelo)"/>

  <!-- Ceja marcada -->
  <path d="M18.6 24.4c3.8-4 22.9-4 26.7 0l-1.9 5.1c-3.1-2.7-19.7-2.7-22.8 0z" fill="#2A2E35"/>

  <!-- Ojos encendidos -->
  <path d="M22.4 28.8 28 31.4" stroke="#E4322B" stroke-width="4" stroke-linecap="round"/>
  <path d="M41.6 28.8 36 31.4" stroke="#E4322B" stroke-width="4" stroke-linecap="round"/>

  <!-- Hocico -->
  <ellipse cx="32" cy="40.6" rx="10.2" ry="7.6" fill="#DDE2E9"/>
  <ellipse cx="28.6" cy="38.8" rx="1.5" ry="1.9" fill="#2A2E35"/>
  <ellipse cx="35.4" cy="38.8" rx="1.5" ry="1.9" fill="#2A2E35"/>
  <path d="M26.6 45.2c3-2.4 7.8-2.4 10.8 0" fill="none" stroke="#2A2E35" stroke-width="2.2" stroke-linecap="round"/>
</svg>
